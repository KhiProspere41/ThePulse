services:
  - type: web
    name: thepulse-backend
    runtime: python
    plan: free
    rootDir: backend
    # The data-pipeline extras (pandas/nfl-data-py) are installed here, not
    # just in requirements.txt, so the scheduled player-stats season check
    # (app/scheduler.py) can actually load a new season the day nflverse
    # publishes it, not just detect that one exists. See requirements-data.txt
    # for why nfl-data-py needs --no-deps.
    buildCommand: pip install -r requirements.txt && pip install -r requirements-data.txt && pip install --no-deps nfl-data-py==0.3.3
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: NFL_SEASON_START
        value: "2026-09-10T00:15:00"
      - key: CFB_SEASON_START
        value: "2026-09-03T00:00:00"
      - key: ODDS_REFRESH_INTERVAL_HOURS
        value: "24"
